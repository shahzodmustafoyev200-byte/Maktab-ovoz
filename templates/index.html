<!DOCTYPE html>
<html>
<head>
    <title>Maktab ovozi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding: 30px;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
        }
        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }
        button {
            background: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Maktab ovozi</h1>
    <p>Anonim fikr va murojaat yuboring</p>

    <form method="post">
        <input name="ism" placeholder="Ism (ixtiyoriy)">
        <textarea name="fikr" placeholder="Fikringiz..." rows="5"></textarea>
        <br>
        <button type="submit">Yuborish</button>
    </form>
</div>

</body>
</html>
